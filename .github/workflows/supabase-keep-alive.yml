name: Supabase keep-alive

# El plan gratis de Supabase pausa un proyecto tras 7 días sin actividad.
# Este workflow hace una consulta real a una tabla cada día para que el
# proyecto registre actividad de base de datos y nunca llegue a pausarse.
# (No sirve pegarle a /rest/v1/: esa ruta devuelve 401 con la anon key y
# no toca la base.) La URL y la anon key son públicas por diseño (son las
# mismas que ya viajan en el bundle de la app publicada).
#
# Si Supabase no responde 200, el job falla en rojo y GitHub avisa por mail.

on:
  schedule:
    - cron: '0 12 * * *' # todos los días a las 12:00 UTC (09:00 Argentina)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta real a la tabla favoritos
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
            "https://ieqtfhdqfvpfstvbfxol.supabase.co/rest/v1/favoritos?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImllcXRmaGRxZnZwZnN0dmJmeG9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MzE3MDAsImV4cCI6MjEwNDMwNzcwMH0.YrQlTH95pqNy_TI7l5xwcDe0WmEQRdYXyHv5HkfY040")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase respondió $status en lugar de 200: el proyecto puede estar pausado o la consulta ya no cuenta como actividad."
            exit 1
          fi
